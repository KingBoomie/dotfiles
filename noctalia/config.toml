[nightlight]
enabled = true
temperature_night = 3600

[plugin_settings."noctalia/screen_recorder"]
video_codec = "hevc"

[plugins]
enabled = [ "felipeartur/ai-usagebar", "noctalia/screen_recorder" ]

[shell]
niri_overview_type_to_launch_enabled = true
polkit_agent = true

    [shell.screenshot]
    directory = "/home/kris/Pictures/Screenshots"

[theme]
mode = "light"

    [theme.templates]
    builtin_ids = [ "niri" ]

[wallpaper.default]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.last]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[widget.bar]
type = "felipeartur/ai-usagebar:bar"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"
